[package]
name = "asciivid"
version = "0.1.0"
edition = "2024"
description = "Render videos as ASCII art into new video files, with DedSec-style glitches"
license = "MIT"
repository = "https://github.com/KemonoNeco/asciivid"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
fontdue = "0.9.5"
rayon = "1.12.0"
