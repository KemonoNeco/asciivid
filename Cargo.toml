[package]
name = "asciivid"
version = "0.1.0"
edition = "2024"
description = "Render videos as ASCII art into new video files, with DedSec-style glitches"
license = "MIT"
repository = "https://github.com/KemonoNeco/asciivid"

[features]
default = ["gpu"]
# wgpu compute renderer, selected at runtime with --gpu
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", optional = true, features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
fastrand = "2.5.0"
fontdue = "0.9.5"
pollster = { version = "1.0.1", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
wgpu = { version = "30.0.1", optional = true }
